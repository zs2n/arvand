<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="عرش أرْوَند: لعبة إدارة مملكة وقرارات بأسلوب بكسل آرت، من إنتاج استوديو قرطاس.">
<title>عرش أرْوَند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;600;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: pixel throne-room stage beside a stone-and-parchment ledger panel; single dark candle-lit look by design */
:root{
  --ink:#120d14; --stone:#211825; --stone2:#2f2335; --stone3:#3f2f47;
  --parch:#e8d6ae; --parch2:#cdb88a; --text:#efe4cc; --muted:#a8987f;
  --gold:#e3b54e; --blood:#b02e43; --moss:#7fa95c; --ash:#8e8892; --sky:#7aa6d8; --edge:#5b4566;
  --f-disp:"Handjet","Noto Kufi Arabic",system-ui,sans-serif;
  --f-body:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.75;margin:0}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px 24px;display:grid;gap:12px}
/* HUD */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--stone);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--ink),inset 0 -3px 0 var(--stone2);padding:8px 12px}
#hud .when{font-family:var(--f-disp);font-size:22px;font-weight:800;color:var(--gold);line-height:1.1;min-width:0}
#hud .when small{display:block;font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;flex:1;min-width:0}
.stat{display:flex;align-items:center;gap:6px;position:relative}
.stat img{width:20px;height:20px;image-rendering:pixelated}
.stat b{font-family:var(--f-disp);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:11px;color:var(--muted)}
.stat.low b{color:#ff7a7a}
.float{position:absolute;top:-14px;inset-inline-start:22px;font-family:var(--f-disp);font-size:18px;font-weight:800;pointer-events:none;animation:up 1.4s ease-out forwards}
.float.pos{color:var(--moss)}.float.neg{color:#ff7a7a}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-18px)}}
.hbtns{display:flex;gap:6px}
/* pixel buttons */
.px{background:var(--stone2);border:2px solid var(--edge);box-shadow:0 3px 0 var(--ink);padding:6px 12px;cursor:pointer;font-size:14px;transition:background .12s}
.px:hover:not(:disabled){background:var(--stone3)}
.px:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.px:disabled{opacity:.45;cursor:not-allowed}
.px.gold{background:#5a4214;border-color:var(--gold);color:#fff3cf}
.px.gold:hover:not(:disabled){background:#715318}
.px.small{padding:3px 9px;font-size:13px}
/* main grid */
#main{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:980px){#main{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}}
#stage{position:relative;border:3px solid var(--edge);box-shadow:0 0 0 3px var(--ink);background:#000;min-width:0}
#stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
#mapWrap{position:relative}
.node{position:absolute;transform:translate(50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;padding:0}
.node i{display:block;width:14px;height:14px;background:var(--gold);border:2px solid var(--ink);transform:rotate(45deg);box-shadow:0 0 0 2px var(--gold)}
.node.sel i{background:#fff;box-shadow:0 0 0 3px var(--blood)}
.node em{font-style:normal;font-size:12px;background:rgba(18,13,20,.85);padding:0 6px;border:1px solid var(--edge);white-space:nowrap}
.node .badge{position:absolute;top:-10px;inset-inline-end:-12px;font-family:var(--f-disp);font-size:13px;background:var(--blood);color:#fff;padding:0 4px;line-height:1.3}
.node .busy{position:absolute;top:-10px;inset-inline-start:-14px;font-size:11px;background:var(--moss);color:#111;padding:0 4px;line-height:1.4}
#card{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#card div{font-family:var(--f-disp);font-size:clamp(26px,4.5vw,46px);font-weight:800;color:var(--gold);text-shadow:0 3px 0 var(--ink);background:rgba(18,13,20,.72);padding:8px 26px;border-block:3px solid var(--gold);text-align:center;line-height:1.25;animation:card 3.2s ease forwards}
#card small{display:block;font-family:var(--f-body);font-size:14px;color:var(--parch);font-weight:400}
@keyframes card{0%{opacity:0;transform:scale(.96)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.queue{position:absolute;bottom:6px;inset-inline-start:8px;font-size:12px;background:rgba(18,13,20,.8);padding:1px 8px;border:1px solid var(--edge)}
/* panel */
#panel{background:var(--stone);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--ink);padding:14px;min-width:0;display:grid;gap:12px}
.who{display:flex;gap:12px;align-items:center}
.who canvas{width:64px;height:64px;image-rendering:pixelated;background:var(--stone2);border:2px solid var(--edge);flex:none}
.who h2{margin:0;font-family:var(--f-disp);font-size:26px;font-weight:800;line-height:1.1;color:var(--parch)}
.who p{margin:0;font-size:12px;color:var(--muted)}
.speech{background:var(--parch);color:#2a1d14;padding:12px 14px;border:2px solid var(--parch2);box-shadow:inset 0 0 0 2px #f4e7c6;min-height:96px;font-size:15.5px;cursor:pointer;line-height:1.85}
.opts{display:grid;gap:8px}
.opt{display:grid;gap:4px;text-align:start;background:var(--stone2);border:2px solid var(--edge);box-shadow:0 3px 0 var(--ink);padding:9px 12px;cursor:pointer;font-size:14.5px}
.opt:hover:not(:disabled){background:var(--stone3);border-color:var(--gold)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;background:var(--ink);border:1px solid var(--edge);padding:0 6px;line-height:1.7;font-variant-numeric:tabular-nums}
.chip img{width:12px;height:12px;image-rendering:pixelated}
.chip.cost{border-color:#7a4a2a;color:#ffc89a}
.chip.req{border-color:#4f6a8a;color:#bfe0ff}
.chip.bad{border-color:#7a2a35;color:#ff9aa8}
.chip.good{border-color:#4a6a3a;color:#bfe8a0}
.chip.risk{border-color:#6a5a2a;color:#ffe08a}
.result{border-inline-start:4px solid var(--gold);padding-inline-start:10px}
h3{margin:0;font-family:var(--f-disp);font-size:22px;font-weight:800;color:var(--gold);line-height:1.2}
.sec{display:grid;gap:8px}
.muted{color:var(--muted);font-size:13px}
.rets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ret{display:flex;gap:8px;align-items:center;background:var(--stone2);border:2px solid var(--edge);padding:6px}
.ret canvas{width:40px;height:40px;image-rendering:pixelated;flex:none;background:var(--ink)}
.ret b{display:block;font-size:13px;line-height:1.4}
.ret small{font-size:11px;line-height:1.5}
.st-ok{color:var(--moss)}.st-no{color:#ff9aa8}.st-mid{color:var(--gold)}
.ret.off{opacity:.45}
.mis{background:var(--stone2);border:2px solid var(--edge);padding:9px 10px;display:grid;gap:6px}
.mis header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mis b{font-size:14.5px}
.mis p{margin:0;font-size:13px;color:var(--muted)}
.sendrow{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg .px.on{background:#5a4214;border-color:var(--gold)}
.ledger{background:var(--parch);color:#2a1d14;padding:14px 16px;border:2px solid var(--parch2);display:grid;gap:10px}
.ledger h3{color:#6a1a22}
.ledger h4{margin:0;font-size:14px;border-bottom:1px dashed #9a845a;padding-bottom:2px;color:#4a3420}
.ledger ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:14px}
.ledger li{display:flex;justify-content:space-between;gap:10px}
.ledger li span:last-child{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ledger .p{color:#2e6a1a}.ledger .n{color:#9a1a22}
.ledger .note{font-size:13.5px;line-height:1.7}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,7,12,.86);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.box{background:var(--stone);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--ink);max-width:640px;width:100%;padding:18px;display:grid;gap:12px;max-height:calc(100% - 20px);overflow:auto}
.title-name{font-family:var(--f-disp);font-size:clamp(48px,11vw,92px);font-weight:800;color:var(--gold);line-height:.95;text-align:center;text-shadow:0 4px 0 #5a1a22}
.title-sub{text-align:center;color:var(--parch);margin:0}
.box p{margin:0}
.fac{display:grid;gap:4px;background:var(--stone2);border:2px solid var(--edge);padding:8px 10px}
.bar{position:relative;height:12px;background:var(--ink);border:1px solid var(--edge)}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--gold)}
.bar u{position:absolute;inset-block:-3px;inset-inline-start:70%;width:2px;background:var(--parch)}
.log{display:grid;gap:4px;font-size:13.5px;max-height:55vh;overflow:auto}
.log div{border-bottom:1px solid var(--stone2);padding-block:3px}
.ending h1{font-family:var(--f-disp);font-size:clamp(36px,8vw,60px);font-weight:800;color:var(--gold);margin:0;line-height:1.05;text-wrap:balance}
.credit{text-align:center;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- v2 additions ---- */
.who canvas{width:96px;height:96px;background:linear-gradient(var(--stone3),var(--ink))}
.ret canvas{width:48px;height:48px}
.letter{background:var(--parch);color:#2a1d14;border:2px solid var(--parch2);box-shadow:inset 0 0 0 2px #f4e7c6;padding:16px 18px;display:grid;gap:10px;position:relative}
.letter .seal{position:absolute;top:-14px;inset-inline-start:16px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-disp);font-size:20px;font-weight:800;color:#fff3cf;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.letter h4{margin:0;font-family:var(--f-disp);font-size:22px;color:#6a1a22;padding-inline-start:40px}
.letter p{margin:0;line-height:1.9}
.letter .opt{background:#efe0bd;border-color:#9a845a;color:#2a1d14;box-shadow:0 3px 0 #9a845a}
.letter .opt:hover:not(:disabled){background:#f6ead0;border-color:#6a1a22}
.adv{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.adv button{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 4px}
.adv canvas{width:28px;height:28px;image-rendering:pixelated;background:var(--ink)}
.advice{display:flex;gap:10px;align-items:flex-start;background:var(--stone2);border:2px dashed var(--edge);padding:8px 10px;font-size:14px}
.advice canvas{width:40px;height:40px;image-rendering:pixelated;flex:none;background:var(--ink)}
.items{display:grid;gap:8px}
.item{background:var(--stone2);border:2px solid var(--edge);padding:8px 10px;display:grid;gap:6px}
.item b{color:var(--gold)}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px;border-bottom:1px solid var(--stone2)}
.settings input[type=checkbox]{width:20px;height:20px;accent-color:var(--gold)}
.settings input[type=range]{accent-color:var(--gold)}
.tut{position:fixed;inset-inline:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
.tut .box{pointer-events:auto;max-width:620px;display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.tut canvas{width:64px;height:64px;image-rendering:pixelated;flex:none;background:linear-gradient(var(--stone3),var(--ink))}
.tut p{margin:0;font-size:14.5px}
.tut .row{margin-top:6px}
.hl{outline:3px solid var(--gold)!important;outline-offset:3px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}
.ends{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.endc{background:var(--stone2);border:2px solid var(--edge);padding:8px;font-size:13px;display:grid;gap:4px}
.endc.got{border-color:var(--gold)}
.endc b{font-family:var(--f-disp);font-size:18px;color:var(--gold)}
.endc.lock b{color:var(--muted)}
.chron img{width:100%;height:auto;image-rendering:pixelated;border:3px solid var(--edge)}
.diffs{display:grid;gap:8px}
.diffs button{text-align:start;display:grid;gap:2px}
.diffs small{color:var(--muted)}
.gens p{line-height:1.9}
.speech-pick{display:grid;gap:8px}
.siegebar{position:relative;height:16px;background:var(--blood);border:2px solid var(--edge)}
.siegebar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--moss);transition:width .6s}
.market{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.market .mis{gap:4px}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 32px);z-index:40;background:var(--stone);border:2px solid var(--gold);padding:6px 14px;font-size:14px;animation:card 3.4s ease forwards}
</style>
</head>
<body>
<div id="app">
  <header id="hud"></header>
  <div id="main">
    <div id="stage">
      <canvas id="scene" width="320" height="180" aria-label="قاعة العرش"></canvas>
      <div id="mapWrap" hidden><canvas id="map" width="320" height="200" aria-label="خريطة المملكة"></canvas><div id="nodes"></div></div>
      <div id="card"></div>
      <div class="queue" id="queue" hidden></div>
    </div>
    <section id="panel" aria-live="polite"></section>
  </div>
</div>
<div id="ov" class="overlay" hidden></div>

<script>
/* ---- engine/util.js ---- */
"use strict";
/* ===== util: helpers shared by data and engine ===== */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const AD='٠١٢٣٤٥٦٧٨٩';
const A=n=>String(Math.round(n)).replace(/-/g,'−').replace(/\d/g,d=>AD[d]);
const sg=v=>(v>0?'+':'')+A(v);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={
 get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
 del(k){try{localStorage.removeItem(k)}catch(e){}}};
const txt=v=>typeof v==='function'?v():v;
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}

/* ===== pixel icons (8x8) ===== */
const ICONS={
 gold:[["..aaaa..",".abbbba.","abbccbba","abcbbcba","abcbbcba","abbccbba",".abbbba.","..aaaa.."],{a:'#8a5a12',b:'#f2c14e',c:'#fff1a8'}],
 food:[["...a....","..aba.a.",".abcbaba","..abcba.","...abba.","..abcba.",".abbba..","..aaa..."],{a:'#6b3d17',b:'#d9913f',c:'#f6d18b'}],
 hap:[[".aa..aa.","abbaabba","abcbbbba","abbbbbba",".abbbba.","..abba..","...aa...","........"],{a:'#5a0f1c',b:'#d8384f',c:'#ff9aa8'}],
 soldiers:[["......aa",".....aba","....aba.","c..aba..",".caba...","..cc....",".cdc....","cd..c..."],{a:'#6d7480',b:'#dfe6ee',c:'#7a4a22',d:'#c9a24a'}],
 pop:[["...aa...","..abba..","..abba..","...aa...",".cccccc.","cccccccc",".cc..cc.",".cc..cc."],{a:'#3b2a20',b:'#e0b089',c:'#5a7fa6'}],
 fort:[["a.a..a.a","aaaaaaaa",".abbbba.",".abccba.",".abbbba.",".abbbba.",".abccba.",".aaaaaa."],{a:'#4a4f5a',b:'#9aa3b0',c:'#20232a'}],
 enemy:[["...a....","..aba...","..abba..",".abcba..",".abccba.","abcccba.","abcccbba",".aaaaaa."],{a:'#3a1a10',b:'#c4552b',c:'#f2b24a'}],
 river:[["........","a..a..a.",".aa.aa.a","........","a..a..a.",".aa.aa.a","........","aaaaaaaa"],{a:'#5fa8e0'}],
 horn:[["a......a","ab....ba",".ab..ba.",".abccba.","..cccc..","..cddc..","..cccc..","...cc..."],{a:'#e8e0c8',b:'#b8a880',c:'#7a5a3a',d:'#c9a24a'}],
 moon:[["..aaa...",".abb....","abb.....","abb.....","abb.....","abb....a",".abbbba.","..aaaa.."],{a:'#9fb8e0',b:'#e8f0ff'}],
 clue:[["..aaaa..",".abbbba.","ab.cc.ba","ab.cc.ba","abbbbbba",".abbbba.","..aaaa.a",".......a"],{a:'#c9a24a',b:'#2a2030',c:'#e3b54e'}],
 chest:[["........",".aaaaaa.","abbbbbba","acccccca","abbddbba","abbbbbba","abbbbbba",".aaaaaa."],{a:'#3a2210',b:'#8a5a2a',c:'#e3b54e',d:'#fff1a8'}],
 arms:[["a......a",".a....a.","..a..a..","...aa...","...aa...","..b..b..",".b....b.","b......b"],{a:'#dfe6ee',b:'#7a4a22'}],
 morale:[["...a....","..aaa...","..aba...",".aabaa..","..aba...","..aba...","..ccc...",".c...c.."],{a:'#e3b54e',b:'#a3283a',c:'#7a4a22'}],
};
const ICON={};
(function(){for(const k in ICONS){const[rows,pal]=ICONS[k];const c=document.createElement('canvas');c.width=8;c.height=8;const x=c.getContext('2d');rows.forEach((r,y)=>[...r].forEach((ch,i)=>{if(pal[ch]){x.fillStyle=pal[ch];x.fillRect(i,y,1,1)}}));ICON[k]=c.toDataURL()}})();
const ic=k=>ICON[k]?`<img src="${ICON[k]}" alt="">`:'';
const STATN={gold:'ذهب',food:'طعام',hap:'رضا',soldiers:'جنود',pop:'سكان',fort:'أسوار',enemy:'جيش بهرام',river:'بنو النهر',horn:'أهل القرن',moon:'رهبنة القمر',clues:'دليل',morale:'معنويات',arms:'سلاح'};

/* ---- engine/sprites.js ---- */
/* ===== Arvand sprites v2: shaded, outlined pixel art (portraits 32x32, bodies 24x44) ===== */
const SP2=(()=>{
const h2r=h=>{if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]};
function rgb2hsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0,l=(mx+mn)/2;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function hsl2hex(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(1,s));l=Math.max(0,Math.min(1,l));const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return'#'+[f(0),f(8),f(4)].map(v=>Math.round(v*255).toString(16).padStart(2,'0')).join('')}
const toward=(h,t,amt)=>{let d=((t-h+540)%360)-180;return h+Math.sign(d)*Math.min(Math.abs(d),amt)};
const RC={};
function ramp(hex){if(RC[hex])return RC[hex];const[h,s,l]=rgb2hsl(h2r(hex));
 const r=[hsl2hex(toward(h,255,26),s*.85,Math.max(.07,l-.30)),hsl2hex(toward(h,255,13),s*.95,Math.max(.1,l-.15)),hex,hsl2hex(toward(h,55,10),s*.95,Math.min(.93,l+.13)),hsl2hex(toward(h,255,34),s*.75,Math.max(.04,l-.44))];
 return RC[hex]=r}/* 0 deep,1 shadow,2 base,3 light,4 outline */
const LV=(()=>{const v=[-.55,-.62,.56],m=Math.hypot(...v);return v.map(x=>x/m)})();
const tone=(nx,ny,nz)=>{const d=nx*LV[0]+ny*LV[1]+nz*LV[2];return d>.74?3:d>.36?2:d>.02?1:0};

function Grid(w,h){const g={w,h,M:new Array(w*h).fill(null),T:new Array(w*h).fill(2),X:new Array(w*h).fill(null)};
 g.in=(x,y)=>x>=0&&y>=0&&x<w&&y<h;g.i=(x,y)=>y*w+x;
 g.set=(x,y,m,t)=>{x|=0;y|=0;if(g.in(x,y)){const i=g.i(x,y);g.M[i]=m;g.T[i]=t;g.X[i]=null}};

 g.blob=(cx,cy,rx,ry,m,test,mode)=>{for(let y=Math.floor(cy-ry);y<=cy+ry;y++)for(let x=Math.floor(cx-rx);x<=cx+rx;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry,r=dx*dx+dy*dy;if(r<=1&&(!test||test(x,y))){const nz=Math.sqrt(1-r);g.set(x,y,m,mode==='flat'?2:tone(dx,dy*.8,nz))}}};

function render(g,mats,cv,scale){

 for(let y=0;y<g.h;y++)for(let x=0;x<g.w;x++){const i=g.i(x,y),m=g.M[i];let col=null;
  if(m){col=g.X[i]||(mats[m]?ramp(mats[m])[g.T[i]]:null)}
  else{for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){const n=g.get(x+dx,y+dy);if(n&&n!=='fx'&&mats[n]){col=ramp(mats[n])[4];break}}}
  if(col){c.fillStyle=col;c.fillRect(x,y,1,1)}}

 }
 // hats
 const H=c.hat;
 if(H==='crown'){for(let y=5;y<=7;y++)for(let x=9;x<=22;x++)g.set(x,y,'gold',y===5?3:x>18?1:2);
  for(const px of[9,12,15,19,22]){g.set(px,4,'gold',3);if(px===15){g.set(15,3,'gold',3);g.set(16,3,'gold',2);g.set(16,4,'gold',2);g.set(15,2,'gold',3)}else g.set(px,3,'gold',2)}
  g.col(12,6,'#c0283a');g.col(19,6,'#c0283a');g.col(15,6,'#5ab8f0');g.col(16,6,'#2a7ab8')}
 if(H==='circlet'){for(let x=10;x<=21;x++)g.set(x,8,'gold',x<15?3:x>18?1:2);g.col(15,8,'#7ad0ff');g.col(16,8,'#3a8ad0')}
 if(H==='helm'){g.blob(cx,10.2,8,7.6,'metal',(x,y)=>y<=10);
  for(let y=10;y<=19;y++){for(const x of[8,9,10])g.set(x,y,'metal',x===8?1:2);for(const x of[21,22,23])g.set(x,y,'metal',x===23?0:1)}

function face(g,e,c){

  g.col(11,13,W);g.col(12,13,irisC||IR);g.col(13,13,D);g.col(18,13,D);g.col(19,13,irisC||IR);g.col(20,13,W)};
 const brows=(L,R)=>{L.forEach(([x,y])=>g.col(x,y,BR));R.forEach(([x,y])=>g.col(x,y,BR))};
 const nose=()=>{g.col(16,15,sk[1]);g.col(16,16,sk[0]);g.col(15,15,sk[3])};
 const flatBrows=()=>brows([[11,10],[12,10],[13,10]],[[18,10],[19,10],[20,10]]);
 nose();
 switch(e){
  case'neutral':flatBrows();eyesOpen();for(let x=14;x<=17;x++)g.col(x,18,LIP);g.col(15,19,sk[3]);break;
  case'happy':flatBrows();g.col(11,13,D);g.col(12,12,D);g.col(13,13,D);g.col(18,13,D);g.col(19,12,D);g.col(20,13,D);

  case'angry':brows([[11,9],[12,10],[13,11]],[[20,9],[19,10],[18,11]]);eyesOpen();for(const x of[11,12,19,20])g.col(x,11,sk[0]);
   for(let x=13;x<=18;x++)g.col(x,18,D);g.col(13,19,LIP);g.col(18,19,LIP);break;
  case'sad':brows([[11,10],[12,10],[13,9]],[[18,9],[19,10],[20,10]]);eyesOpen();g.col(12,14,'#8ac8ff');g.col(12,15,'#5aa0e0');
   for(let x=14;x<=17;x++)g.col(x,18,LIP);g.col(13,19,LIP);g.col(18,19,LIP);break;
  case'shock':brows([[11,9],[12,9],[13,9]],[[18,9],[19,9],[20,9]]);eyesOpen();g.col(11,14,W);g.col(12,14,W);g.col(13,14,W);g.col(18,14,W);g.col(19,14,W);g.col(20,14,W);g.col(13,13,W);g.col(18,13,W);
   g.col(15,18,D);g.col(16,18,D);g.col(15,19,D);g.col(16,19,D);g.col(14,18,LIP);g.col(17,18,LIP);g.col(23,8,'#bfe6ff');g.col(23,9,'#7ac0ff');g.col(23,10,'#5aa0e0');break;
  case'smug':brows([[11,10],[12,10],[13,10]],[[18,9],[19,9],[20,10]]);eyesOpen();for(let x=11;x<=13;x++)g.col(x,12,sk[0]);for(let x=18;x<=20;x++)g.col(x,12,sk[0]);g.col(11,12,D);g.col(20,12,D);
   for(let x=14;x<=16;x++)g.col(x,18,LIP);g.col(17,17,D);g.col(18,17,D);break;
  case'cold':flatBrows();eyesOpen();for(let x=11;x<=13;x++)g.col(x,12,D);for(let x=11;x<=20;x++)if(x<=13||x>=18)g.col(x,11,sk[1]);
   for(let x=14;x<=17;x++)g.col(x,18,LIP);g.col(17,17,LIP);break;
  case'tired':brows([[11,10],[12,10],[13,9]],[[18,9],[19,10],[20,10]]);eyesOpen();for(const x of[11,12,13,18,19,20]){g.col(x,12,sk[0]);g.col(x,14,sk[1])}
   for(let x=14;x<=17;x++)g.col(x,18,LIP);break;

 }}

  const c=C[key]||C.guard;const r=kind==='p'?SP2.portrait(c,expr):kind==='s'?SP2.bodySide(c,frame||0,expr,'stand'):kind==='k'?SP2.bodySide(c,0,expr,'seated'):kind==='t'?SP2.body34(c,frame||0,expr):SP2.body(c,frame||0,expr);cv=SP2.render(r.g,r.mats,document.createElement('canvas'));cache.set(id,cv);return cv};

/* apply an effect object; returns list of visible deltas */
function apply(e){const out=[];if(!e)return out;
 for(const k of['gold','food','hap','soldiers','pop','fort','enemy','clues','morale','arms'])if(e[k]){
  const before=S[k];let v=S[k]+e[k];
  if(k==='hap')v=clamp(v,0,100);else if(k==='fort')v=clamp(v,0,3);else if(k==='morale')v=clamp(v,-30,60);else v=Math.max(0,v);
  S[k]=v;if(v!==before)out.push([k,v-before])}
 for(const f of['river','horn','moon'])if(e[f]){const b=S.rel[f];S.rel[f]=clamp(b+e[f],0,100);if(S.rel[f]!==b)out.push([f,S.rel[f]-b])}
 if(e.set)e.set.forEach(f=>S.flags[f]=1);
 if(e.unset)e.unset.forEach(f=>delete S.flags[f]);
 if(e.unlock){S.ret[e.unlock].on=1;out.push(['unlock',e.unlock])}
 if(e.lose){S.ret[e.lose].on=0;S.missions=S.missions.filter(m=>m.ret!==e.lose);out.push(['lose',e.lose])}
 if(e.injure){S.ret[e.injure[0]].inj=S.week+e.injure[1];out.push(['injure',e.injure[0]])}
 if(e.retmod){S.ret[e.retmod[0]].mod=(S.ret[e.retmod[0]].mod||0)+e.retmod[1];out.push(['retmod',e.retmod])}
 if(e.follow)S.follow.push({id:e.follow[0],w:S.week+e.follow[1]});
 if(e.plan)S.plan=e.plan;
 if(e.item&&!S.items.includes(e.item)){S.items.push(e.item);out.push(['item',e.item])}
 if(e.son)for(const k in e.son)S.son[k]+=e.son[k];
 for(const f of apply.extra)f(e,out);
 floatDeltas(out);return out}

const PRE=[];/* steps before petitions each week: f(done) */
function buildQueue(){
 if(S.week===12){S.queue=['siege'];return}
 const q=[];const add=id=>{if(E[id]&&!q.includes(id))q.push(id)};
 for(const id in E){const e=E[id];if(!e.story||S.done[id])continue;if(S.week>=e.w[0]&&S.week<=e.w[1]&&(!e.cond||e.cond()))add(id)}

 S.deferred.filter(d=>d.w===S.week).forEach(d=>add(d.id));S.deferred=S.deferred.filter(d=>d.w>S.week);
 const waiting=new Set([...S.deferred.map(d=>d.id),...S.follow.map(f=>f.id)]);
 const pool=shuffle(Object.keys(E).filter(id=>{const e=E[id];return e.pool&&!S.done[id]&&!waiting.has(id)&&!q.includes(id)&&S.week>=e.w[0]&&S.week<=e.w[1]&&(!e.cond||e.cond())}));
 /* chapter-3 filler first in late weeks so the second half stays busy */
 if(S.week>=7)pool.sort((a,b)=>(E[b].w[0]>=7)-(E[a].w[0]>=7));
 const target=S.week===11?4:4;while(q.length<target&&pool.length)q.splice(1+Math.floor(Math.random()*q.length),0,pool.shift());
 if(S.week===1)q.sort((a,b)=>(a==='herald'?-1:b==='herald'?1:0));
 S.queue=q;
}
function startWeek(){
 S.phase='court';S.usedW={};S.qi=0;S.wk=[];S.asked={};buildQueue();
 run('weekStart');save();showStage('scene');hud();
 const ch=chapter(S.week);if(ch!==S.lastCh){S.lastCh=ch;$('#card').innerHTML=`<div>${CH[ch][0]}<small>${CH[ch][1]}</small></div>`;setTimeout(()=>{$('#card').innerHTML=''},3300)}

 setTimeout(step,500);
}

 <div class="sec" id="secRet"><h3>المجلس</h3><div class="rets">${keys.map(retCard).join('')}</div></div>
 <div class="sec" id="secMis"><h3>${L.n}</h3>${ms.length?ms.map(m=>misCard(m)).join(''):'<p class="muted">لا مهمّات هنا هذا الأسبوع. اختر موقعًا آخر من الخريطة.</p>'}</div>
 ${COUNCIL.map(s=>s.html()).join('')}
 <div class="sec" id="secTreasury"><h3>الخزانة والقوانين</h3>
  <div><span class="muted">الضرائب</span><div class="seg">${TAX.map((t,i)=>`<button class="px small${S.tax===i?' on':''}" data-tax="${i}">${t.n}</button>`).join('')}</div></div>
  <div><span class="muted">حصص الطعام</span><div class="seg"><button class="px small${!S.ration?' on':''}" data-r="0">كاملة</button><button class="px small${S.ration?' on':''}" data-r="1">مقنّنة (−٢٥٪ استهلاك، −٤ رضا)</button></div></div>
  <div class="row"><span class="muted">التجنيد: ٢٥ ذهبًا ← ١٠ جنود (−٥ سكان، −١ رضا)</span><button class="px small" id="rec" ${S.gold<25||S.pop<20?'disabled':''}>جنّد</button></div>
  <div class="chips"><span class="chip ${ec.gold>=0?'good':'bad'}">${ic('gold')}الخزينة المتوقعة ${sg(ec.gold)} أسبوعيًا</span><span class="chip ${ec.food>=0?'good':'bad'}">${ic('food')}المؤن المتوقعة ${sg(ec.food)} أسبوعيًا</span>${S.week>=3&&!F('wells')?'<span class="chip bad">الجفاف ينقص الحصاد (احفر الآبار)</span>':''}</div>
 </div>
 <button class="px gold" id="endW">اختم الأسبوع ${A(S.week)}</button>`;
 $('#panel').querySelectorAll('canvas[data-p]').forEach(c=>SPR.paint(c,c.dataset.p,'neutral','#120d14'));
 $('#panel').querySelectorAll('[data-tax]').forEach(b=>b.onclick=()=>{S.tax=+b.dataset.tax;renderCouncil()});
 $('#panel').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.ration=+b.dataset.r;renderCouncil()});
 $('#rec').onclick=()=>{S.gold-=25;apply({soldiers:10,pop:-5,hap:-1});floatDeltas([['gold',-25]]);renderCouncil()};
 $('#panel').querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{const[mid,k]=b.dataset.send.split('|');const m=M.find(x=>x.id===mid);for(const[c,v]of Object.entries(m.cost||{}))S[c]-=v;S.missions.push({id:mid,ret:k,end:S.week+m.dur-1,at:S.week});sfx('choose');renderCouncil()});
 $('#panel').querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{const i=+b.dataset.cancel;const a=S.missions[i];const m=M.find(x=>x.id===a.id);for(const[c,v]of Object.entries(m.cost||{}))S[c]+=v;S.missions.splice(i,1);renderCouncil()});
 COUNCIL.forEach(s=>s.bind&&s.bind());
 $('#endW').onclick=confirmEnd;
 run('council');
}
function misCard(m){
 const ai=S.missions.findIndex(a=>a.id===m.id);let body;
 if(ai>=0){const a=S.missions[ai];body=`<div class="row"><span class="chip req">${N[a.ret][0]} في المهمة حتى نهاية الأسبوع ${A(a.end)}</span>${a.at===S.week?`<button class="px small" data-cancel="${ai}">استدعِ</button>`:''}</div>`}
 else{const can=Object.entries(m.cost||{}).every(([k,v])=>S[k]>=v);
  const ks=RKEYS.filter(k=>S.ret[k].on&&(!m.only||m.only===k));
  body=`<div class="sendrow">${ks.map(k=>{const ok=avail(k)&&can;return`<button class="px small" data-send="${m.id}|${k}" ${ok?'':'disabled'} title="${retState(k)}">${N[k][0].split(' ').pop()} · ${A(chance(m,k)*100)}٪</button>`}).join('')}</div>`}
 return`<div class="mis"><header><b>${m.n}</b><span class="chips">${costChips(m.cost)}<span class="chip">${SKN[m.sk]}</span><span class="chip">${m.dur>1?'أسبوعان':'أسبوع'}</span>${m.risk?'<span class="chip risk">خطر إصابة</span>':''}${m.personal?'<span class="chip good">مهمة شخصية</span>':''}</span></header><p>${txt(m.d)}</p>${body}</div>`}
function confirmEnd(){
 const idle=RKEYS.filter(k=>avail(k));
 const ec=econ();const warn=[];
 if(idle.length)warn.push(`${idle.map(k=>N[k][0]).join('، ')} بلا مهمة.`);
 if(S.food+ec.food<0)warn.push('المؤن لن تكفي: سيجوع الناس.');
 if(S.gold+ec.gold<0)warn.push('الخزينة ستعجز عن رواتب الجنود.');
 if(!warn.length){endWeek();return}
 $('#ov').hidden=false;$('#ov').innerHTML=`<div class="box"><h3>قبل أن تختم الأسبوع</h3>${warn.map(w=>`<p>${w}</p>`).join('')}<div class="row"><button class="px" id="cb">عودة</button><button class="px gold" id="cy">اختم على أي حال</button></div></div>`;
 $('#cb').onclick=()=>$('#ov').hidden=true;$('#cy').onclick=()=>{$('#ov').hidden=true;endWeek()};
}

/* ---- engine/report.js ---- */
/* ===== ENGINE: end of week ===== */
function endWeek(){
 const R={missions:[],events:[]};
 const keep=[];
 for(const a of S.missions){if(a.end>S.week){keep.push(a);continue}
  const m=M.find(x=>x.id===a.id);const ok=Math.random()<chance(m,a.ret);
  const eff=(ok?m.ok():m.no())||{};let t=(ok?'نجحت: ':'فشلت: ')+txt(ok?m.okT:m.noT);
  if(!ok&&m.risk&&Math.random()<.5){eff.injure=[a.ret,m.risk];t+=`، وأُصيب ${N[a.ret][0]}`}
  apply(eff);R.missions.push({who:N[a.ret][0],name:m.n,t});S.log.push(`الأسبوع ${A(S.week)} · مهمة «${m.n}» (${N[a.ret][0]}): ${ok?'نجاح':'فشل'}`);
  if(m.personal)S.chron.push({w:S.week,who:a.ret,t:m.n+(ok?' (نجحت)':' (فشلت)'),x:ok?'happy':'sad'})}
 S.missions=keep;
 const ec=econ();
 S.gold+=ec.gold;S.food+=ec.food;
 let dh=TAX[S.tax].h+(S.ration?-4:0);
 if(S.gold<0){const d=Math.ceil(S.soldiers*.15);S.soldiers-=d;S.gold=0;dh-=5;R.events.push(`لم تُدفع الرواتب: فرّ ${A(d)} جنديًا.`)}
 if(S.food<0){const d=Math.ceil(S.pop*.08);S.pop-=d;S.food=0;dh-=10;S.famines++;R.events.push(`مجاعة: مات أو رحل ${A(d)} من السكان.`)}
 if(S.hap>=65){S.pop+=3;R.events.push('الرخاء يجذب العائلات: +٣ سكان.')}
 if(S.hap>70)dh-=1;
 if(dh){S.hap=clamp(S.hap+dh,0,100);R.events.push(`تغيّر رضا الشعب بسبب القوانين والأحوال: ${sg(dh)}.`)}
 S.enemy+=DIFF[S.diff].growth;R.events.push('جيش بهرام يكبر: يلتحق به الجائعون من الشرق.');
 if(S.clues>=3&&!F('exposed')&&!F('cluenote')){S.flags.cluenote=1;R.events.push('نوال وسليم يتفقان: كل الأدلة تشير إلى خاتم الأسد. الأمير رستم.')}
 for(const l of run('weekEnd'))R.events.push(l);
 const wk=S.week;S.week++;S.phase='report';hud();sfx('bell');
 const sumLine=arr=>arr.map(([n,v])=>`<li><span>${n}</span><span class="${v>=0?'p':'n'}">${sg(v)}</span></li>`).join('');
 const note=l=>`<li class="note" style="display:block">${l}</li>`;
 $('#panel').innerHTML=`<div class="ledger"><h3>دفتر الأسبوع ${A(wk)}</h3>
 <div><h4>${ic('gold')} الخزينة</h4><ul>${sumLine(ec.lines.gold)}<li><span><b>الرصيد</b></span><span>${A(S.gold)}</span></li></ul></div>
 <div><h4>${ic('food')} المخازن</h4><ul>${sumLine(ec.lines.food)}<li><span><b>الرصيد</b></span><span>${A(S.food)}</span></li></ul></div>
 ${R.missions.length?`<div><h4>تقارير المهام</h4><ul>${R.missions.map(m=>note(`<b>${m.name}</b> · ${m.who}: ${m.t}.`)).join('')}</ul></div>`:''}
 ${S.wk.length?`<div><h4>ما جرى في القاعة</h4><ul>${S.wk.map(note).join('')}</ul></div>`:''}
 <div><h4>أحوال المملكة</h4><ul>${R.events.map(note).join('')}</ul></div>
 ${run('report').join('')}
 </div><button class="px gold" id="nw">${S.week===12?'بهرام عند الأسوار…':'الأسبوع '+A(S.week)}</button>`;
 showStage('scene');
 if(S.hap<=0){$('#nw').onclick=()=>ending('revolt');return}
 $('#nw').onclick=startWeek;$('#nw').focus();
}

/* ---- engine/systems.js ---- */
/* ===== ENGINE: extra rules that plug into core ===== */
/* siege bonuses from chapter-3 preparations */
myPower.extra.push(parts=>{
 if(F('arrows'))parts.push(['عشرة آلاف سهم',20]);else if(F('halfarrows'))parts.push(['خمسة آلاف سهم',10]);
 if(F('oil'))parts.push(['قدور الزيت المغلي',25]);
});

/* ---- engine/ending.js ---- */
/* ===== ENGINE: finale, endings, title, boot ===== */
let FINALE=null;/* siege scene can replace the direct calculation */
function finale(){
 if(F('peacedone')){ending('peace');return}
 if(FINALE){FINALE();return}
 resolveBattle();
}
function resolveBattle(bonus){
 const me=myPower();if(bonus){me.parts.push(...bonus.parts);me.total+=bonus.total}
 const en=enemyPower();const r=me.total/en;S.battle={me,en,r};
 let k;if(r>=1.1)k=F('exposed')?(S.hap>=50?'dawn':'victory'):(S.hap>=60?'shadow':'stolen');else if(r>=.85)k='ashwin';else k=(F('betrothed')&&S.rel.horn>=50)?'exile':'fall';
 ending(k);
}
function ending(k){
 S.phase='end';S.endKey=k;store.del(SAVE);
 const[t,body]=ENDS[k];const b=S.battle;const lines=[];
 if(b){lines.push(...b.me.parts.map(([n,v])=>`<li><span>${n}</span><span class="p">${A(v)}</span></li>`));lines.push(`<li><span><b>قوّتك</b></span><span>${A(b.me.total)}</span></li><li><span><b>جيش بهرام</b>${S.rel.moon>=70&&!F('betrayedmoon')?' (أضعفه سحر القمر)':''}${!F('exposed')?' (بمساعدة الخائن)':''}</span><span class="n">${A(b.en)}</span></li>`)}
 const fam=[];if(F('linatrust'))fam.push('لينا وثقت بك حتى النهاية.');if(F('linacold'))fam.push('لينا لم تسامحك على الخطبة.');if(F('queentrust'))fam.push('الملكة ديما بقيت إلى جانبك.');if(F('pardoned'))fam.push('رستم قاتل في الصف الأول ليمحو عاره.');if(F('betrayedmoon'))fam.push('أسيل لم تعد من الشرق.');
 const extra=run('ending',k);
 $('#ov').hidden=false;$('#ov').innerHTML=`<div class="box ending"><p class="muted">النهاية · ${DIFF[S.diff].n}</p><h1>${t}</h1><p>${body}</p>
 ${lines.length?`<div class="ledger"><h4>ميزان الحصار</h4><ul>${lines.join('')}</ul></div>`:''}
 ${fam.length?`<p class="muted">${fam.join(' ')}</p>`:''}
 <p class="muted">رضا ${A(S.hap)} · جنود ${A(S.soldiers)} · بنو النهر ${A(S.rel.river)} · أهل القرن ${A(S.rel.horn)} · رهبنة القمر ${A(S.rel.moon)}</p>
 ${extra.join('')}
 <div class="row"><button class="px gold" id="again">احكم من جديد</button></div><p class="credit">إنتاج استوديو قرطاس</p></div>`;
 $('#again').onclick=()=>title();
 run('endingBind',k);
}
HOOK.endingBind=[];
function title(){
 const sv=load();
 $('#ov').hidden=false;$('#ov').innerHTML=`<div class="box"><div class="title-name">عرش أرْوَند</div><p class="title-sub">لعبة إدارة مملكة وقرارات</p>
 <p>أنت الملك سالار. الجفاف يأكل حقولك، وأخوك يبتسم أكثر مما ينبغي، وفي الشرق يجمع بهرام سيّد أرض الرماد جيشًا جائعًا. أمامك اثنا عشر أسبوعًا قبل أن يطرق بوابتك.</p>
 <p class="muted">استقبل رعاياك، وأدِر الذهب والطعام والجنود، وأرسل مستشاريك في المهام، واكسب الحلفاء أو اخسرهم. كل قرار يُحسب.</p>
 <h3>اختر مستوى الحكم</h3><div class="diffs">${Object.entries(DIFF).map(([k,d])=>`<button class="px${k==='normal'?' gold':''}" data-diff="${k}"><b>${d.n}</b><small>${d.d}</small></button>`).join('')}</div>
 <div class="row">${sv?`<button class="px" id="cg">تابع من الأسبوع ${A(sv.week)} (${DIFF[sv.diff].n})</button>`:''}<button class="px" id="hp">طريقة اللعب</button>${title.extra.map(b=>`<button class="px" id="${b.id}">${b.label}</button>`).join('')}</div>
 <p class="credit">إنتاج استوديو قرطاس</p></div>`;
 $$('[data-diff]').forEach(b=>b.onclick=()=>{S=fresh(b.dataset.diff);$('#ov').hidden=true;sfx('good');startWeek()});
 if(sv)$('#cg').onclick=()=>{S=sv;S.lastCh=0;$('#ov').hidden=true;startWeek()};
 $('#hp').onclick=()=>{showHelp();$('#mx').onclick=()=>title()};
 title.extra.forEach(b=>{$('#'+b.id).onclick=b.click});
}
title.extra=[];
function boot(data){
 S=fresh();hud();$('#panel').innerHTML=`<h3>قاعة العرش</h3><p class="muted">الشموع مضاءة، والعرش ينتظر.</p>`;
 requestAnimationFrame(loop);
 if(data&&data.S&&data.S.v===2&&data.S.phase!=='end'){S=data.S;S.lastCh=0;startWeek()}else title();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.__arvand={get S(){return S},set S(v){S=v},E,M,choose,endWeek,finale,myPower,enemyPower,startWeek,renderCouncil,buildQueue,optionsOf,optState,apply,fresh};
(window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{}));

</script>
