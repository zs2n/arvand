<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="عرش أرْوَند: لعبة إدارة مملكة وقرارات بأسلوب بكسل آرت، من إنتاج استوديو قرطاس.">
</head>
<body>
<title>عرش أرْوَند</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;600;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: pixel throne-room stage beside a stone-and-parchment ledger panel; single dark candle-lit look by design */
:root{
  --ink:#120d14; --stone:#211825; --stone2:#2f2335; --stone3:#3f2f47;
  --parch:#e8d6ae; --parch2:#cdb88a; --text:#efe4cc; --muted:#a8987f;
  --gold:#e3b54e; --blood:#b02e43; --moss:#7fa95c; --ash:#8e8892; --sky:#7aa6d8; --edge:#5b4566;
  --f-disp:"Handjet","Noto Kufi Arabic",system-ui,sans-serif;
  --f-body:"Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.75;margin:0}
*{box-sizing:border-box}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--gold);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:10px 24px;display:grid;gap:12px}
/* HUD */
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--stone);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--ink),inset 0 -3px 0 var(--stone2);padding:8px 12px}
#hud .when{font-family:var(--f-disp);font-size:22px;font-weight:800;color:var(--gold);line-height:1.1;min-width:0}
#hud .when small{display:block;font-family:var(--f-body);font-size:12px;font-weight:400;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;flex:1;min-width:0}
.stat{display:flex;align-items:center;gap:6px;position:relative}
.stat img{width:20px;height:20px;image-rendering:pixelated}
.stat b{font-family:var(--f-disp);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:11px;color:var(--muted)}
.stat.low b{color:#ff7a7a}
.float{position:absolute;top:-14px;inset-inline-start:22px;font-family:var(--f-disp);font-size:18px;font-weight:800;pointer-events:none;animation:up 1.4s ease-out forwards}
.float.pos{color:var(--moss)}.float.neg{color:#ff7a7a}
@keyframes up{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-18px)}}
.hbtns{display:flex;gap:6px}
/* pixel buttons */
.px{background:var(--stone2);border:2px solid var(--edge);box-shadow:0 3px 0 var(--ink);padding:6px 12px;cursor:pointer;font-size:14px;transition:background .12s}
.px:hover:not(:disabled){background:var(--stone3)}
.px:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.px:disabled{opacity:.45;cursor:not-allowed}
.px.gold{background:#5a4214;border-color:var(--gold);color:#fff3cf}
.px.gold:hover:not(:disabled){background:#715318}
.px.small{padding:3px 9px;font-size:13px}
/* main grid */
#main{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:980px){#main{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);align-items:start}}
#stage{position:relative;border:3px solid var(--edge);box-shadow:0 0 0 3px var(--ink);background:#000;min-width:0}
#stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
#mapWrap{position:relative}
.node{position:absolute;transform:translate(50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;cursor:pointer;padding:0}
.node i{display:block;width:14px;height:14px;background:var(--gold);border:2px solid var(--ink);transform:rotate(45deg);box-shadow:0 0 0 2px var(--gold)}
.node.sel i{background:#fff;box-shadow:0 0 0 3px var(--blood)}
.node em{font-style:normal;font-size:12px;background:rgba(18,13,20,.85);padding:0 6px;border:1px solid var(--edge);white-space:nowrap}
.node .badge{position:absolute;top:-10px;inset-inline-end:-12px;font-family:var(--f-disp);font-size:13px;background:var(--blood);color:#fff;padding:0 4px;line-height:1.3}
.node .busy{position:absolute;top:-10px;inset-inline-start:-14px;font-size:11px;background:var(--moss);color:#111;padding:0 4px;line-height:1.4}
#card{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#card div{font-family:var(--f-disp);font-size:clamp(26px,4.5vw,46px);font-weight:800;color:var(--gold);text-shadow:0 3px 0 var(--ink);background:rgba(18,13,20,.72);padding:8px 26px;border-block:3px solid var(--gold);text-align:center;line-height:1.25;animation:card 3.2s ease forwards}
#card small{display:block;font-family:var(--f-body);font-size:14px;color:var(--parch);font-weight:400}
@keyframes card{0%{opacity:0;transform:scale(.96)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.queue{position:absolute;bottom:6px;inset-inline-start:8px;font-size:12px;background:rgba(18,13,20,.8);padding:1px 8px;border:1px solid var(--edge)}
/* panel */
#panel{background:var(--stone);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--ink);padding:14px;min-width:0;display:grid;gap:12px}
.who{display:flex;gap:12px;align-items:center}
.who canvas{width:64px;height:64px;image-rendering:pixelated;background:var(--stone2);border:2px solid var(--edge);flex:none}
.who h2{margin:0;font-family:var(--f-disp);font-size:26px;font-weight:800;line-height:1.1;color:var(--parch)}
.who p{margin:0;font-size:12px;color:var(--muted)}
.speech{background:var(--parch);color:#2a1d14;padding:12px 14px;border:2px solid var(--parch2);box-shadow:inset 0 0 0 2px #f4e7c6;min-height:96px;font-size:15.5px;cursor:pointer;line-height:1.85}
.opts{display:grid;gap:8px}
.opt{display:grid;gap:4px;text-align:start;background:var(--stone2);border:2px solid var(--edge);box-shadow:0 3px 0 var(--ink);padding:9px 12px;cursor:pointer;font-size:14.5px}
.opt:hover:not(:disabled){background:var(--stone3);border-color:var(--gold)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:12px;background:var(--ink);border:1px solid var(--edge);padding:0 6px;line-height:1.7;font-variant-numeric:tabular-nums}
.chip img{width:12px;height:12px;image-rendering:pixelated}
.chip.cost{border-color:#7a4a2a;color:#ffc89a}
.chip.req{border-color:#4f6a8a;color:#bfe0ff}
.chip.bad{border-color:#7a2a35;color:#ff9aa8}
.chip.good{border-color:#4a6a3a;color:#bfe8a0}
.chip.risk{border-color:#6a5a2a;color:#ffe08a}
.result{border-inline-start:4px solid var(--gold);padding-inline-start:10px}
h3{margin:0;font-family:var(--f-disp);font-size:22px;font-weight:800;color:var(--gold);line-height:1.2}
.sec{display:grid;gap:8px}
.muted{color:var(--muted);font-size:13px}
.rets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ret{display:flex;gap:8px;align-items:center;background:var(--stone2);border:2px solid var(--edge);padding:6px}
.ret canvas{width:40px;height:40px;image-rendering:pixelated;flex:none;background:var(--ink)}
.ret b{display:block;font-size:13px;line-height:1.4}
.ret small{font-size:11px;line-height:1.5}
.st-ok{color:var(--moss)}.st-no{color:#ff9aa8}.st-mid{color:var(--gold)}
.ret.off{opacity:.45}
.mis{background:var(--stone2);border:2px solid var(--edge);padding:9px 10px;display:grid;gap:6px}
.mis header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mis b{font-size:14.5px}
.mis p{margin:0;font-size:13px;color:var(--muted)}
.sendrow{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg .px.on{background:#5a4214;border-color:var(--gold)}
.ledger{background:var(--parch);color:#2a1d14;padding:14px 16px;border:2px solid var(--parch2);display:grid;gap:10px}
.ledger h3{color:#6a1a22}
.ledger h4{margin:0;font-size:14px;border-bottom:1px dashed #9a845a;padding-bottom:2px;color:#4a3420}
.ledger ul{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:14px}
.ledger li{display:flex;justify-content:space-between;gap:10px}
.ledger li span:last-child{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.ledger .p{color:#2e6a1a}.ledger .n{color:#9a1a22}
.ledger .note{font-size:13.5px;line-height:1.7}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
/* overlays */
.overlay{position:fixed;inset:0;background:rgba(10,7,12,.86);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.box{background:var(--stone);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--ink);max-width:640px;width:100%;padding:18px;display:grid;gap:12px;max-height:calc(100% - 20px);overflow:auto}
.title-name{font-family:var(--f-disp);font-size:clamp(48px,11vw,92px);font-weight:800;color:var(--gold);line-height:.95;text-align:center;text-shadow:0 4px 0 #5a1a22}
.title-sub{text-align:center;color:var(--parch);margin:0}
.box p{margin:0}
.fac{display:grid;gap:4px;background:var(--stone2);border:2px solid var(--edge);padding:8px 10px}
.bar{position:relative;height:12px;background:var(--ink);border:1px solid var(--edge)}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--gold)}
.bar u{position:absolute;inset-block:-3px;inset-inline-start:70%;width:2px;background:var(--parch)}
.log{display:grid;gap:4px;font-size:13.5px;max-height:55vh;overflow:auto}
.log div{border-bottom:1px solid var(--stone2);padding-block:3px}
.ending h1{font-family:var(--f-disp);font-size:clamp(36px,8vw,60px);font-weight:800;color:var(--gold);margin:0;line-height:1.05;text-wrap:balance}
.credit{text-align:center;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <header id="hud"></header>
  <div id="main">
    <div id="stage">
      <canvas id="scene" width="320" height="180" aria-label="قاعة العرش"></canvas>
      <div id="mapWrap" hidden><canvas id="map" width="320" height="200" aria-label="خريطة المملكة"></canvas><div id="nodes"></div></div>
      <div id="card"></div>
      <div class="queue" id="queue" hidden></div>
    </div>
    <section id="panel" aria-live="polite"></section>
  </div>
</div>
<div id="ov" class="overlay" hidden></div>

<script>
"use strict";
document.documentElement.lang='ar';document.documentElement.dir='rtl';
const $=s=>document.querySelector(s);

const ic=k=>`<img src="${ICON[k]}" alt="">`;

/* ---------- colors & sprites ---------- */
function shade(hex,a){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const t=a<0?0:255,p=Math.abs(a);r=Math.round(r+(t-r)*p);g=Math.round(g+(t-g)*p);b=Math.round(b+(t-b)*p);return'#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}

function drawPerson(g,x,y,c,frame,flip,seated){
 const ox=Math.round(x-7),oy=Math.round(y-26)+(frame===1||frame===2?-1:0);
 const P=(xx,yy,w,h,col)=>{g.fillStyle=col;g.fillRect(ox+(flip?14-xx-w:xx),oy+yy,w,h)};
 const dark=shade(c.robe,-.32),boot='#24180f';
 if(c.cape)P(2,9,10,14,c.cape);
 if(!seated){const ly=oy+(frame?1:0);
  if(frame===1){P(4,22,2,3,boot);P(8,22,2,5,boot)}else if(frame===2){P(4,22,2,5,boot);P(8,22,2,3,boot)}else{P(4,22,2,4,boot);P(8,22,2,4,boot)}}
 P(3,9,8,6,c.robe);P(2,15,10,7,c.robe);P(2,21,10,1,dark);P(3,15,8,1,c.trim);P(6,9,2,6,shade(c.robe,.14));
 P(1,10,2,6,dark);P(1,16,2,1,c.skin);P(11,10,2,6,dark);P(11,16,2,1,c.skin);
 P(4,2,6,7,c.skin);P(5,9,4,0.01,c.skin);P(8,5,1,1,'#1a1012');P(9,6,1,1,shade(c.skin,-.2));
 if(c.beard){P(5,7,5,2,c.beard);P(6,9,3,1,c.beard)}
 if(c.hs===1){P(4,1,6,2,c.hair);P(4,3,2,3,c.hair)}
 if(c.hs===2){P(4,1,6,2,c.hair);P(3,2,2,9,c.hair);P(5,3,1,2,c.hair)}
 const gold='#e3b54e';

function apply(e){const out=[];if(!e)return out;
 for(const k of['gold','food','hap','soldiers','pop','fort','enemy','clues'])if(e[k]){
  const before=S[k];let v=S[k]+e[k];
  if(k==='hap')v=clamp(v,0,100);else if(k==='fort')v=clamp(v,0,3);else v=Math.max(0,v);
  S[k]=v;if(v!==before)out.push([k,v-before])}
 for(const f of['river','horn','moon'])if(e[f]){const b=S.rel[f];S.rel[f]=clamp(b+e[f],0,100);if(S.rel[f]!==b)out.push([f,S.rel[f]-b])}
 if(e.set)e.set.forEach(f=>S.flags[f]=1);
 if(e.unlock){S.ret[e.unlock].on=1;out.push(['unlock',e.unlock])}
 if(e.injure){S.ret[e.injure[0]].inj=S.week+e.injure[1];out.push(['injure',e.injure[0]])}
 if(e.follow)S.follow.push({id:e.follow[0],w:S.week+e.follow[1]});
 if(e.plan)S.plan=e.plan;
 floatDeltas(out);return out}

  const b=document.createElement('button');b.className='node'+(k===selLoc?' sel':'');b.style.right=(100-L.x/320*100)+'%';b.style.top=(L.y/200*100)+'%';
  b.innerHTML=`<i></i><em>${L.n}</em>${ms.length?`<span class="badge">${A(ms.length)}</span>`:''}${here.length?`<span class="busy">${here.map(m=>N[m.ret][0].split(' ').pop()).join('، ')}</span>`:''}`;
  b.onclick=()=>{selLoc=k;renderCouncil()};b.setAttribute('aria-label',L.n);box.appendChild(b)}}

/* ---------- court flow ---------- */
function buildQueue(){
 if(S.week===12){S.queue=['siege'];return}
 const q=[];
 for(const id in E){const e=E[id];if(!e.story||S.done[id])continue;if(S.week>=e.w[0]&&S.week<=e.w[1]&&(!e.cond||e.cond()))q.push(id)}
 S.follow.filter(f=>f.w===S.week).forEach(f=>{if(!q.includes(f.id))q.push(f.id)});
 S.follow=S.follow.filter(f=>f.w!==S.week);
 const pool=Object.keys(E).filter(id=>{const e=E[id];return e.pool&&!S.done[id]&&S.week>=e.w[0]&&S.week<=e.w[1]&&(!e.cond||e.cond())}).sort(()=>Math.random()-.5);
 const target=S.week===11?3:4;while(q.length<target&&pool.length)q.splice(Math.floor(Math.random()*(q.length+1)),0,pool.pop());
 // keep herald first in week 1
 if(S.week===1){q.sort((a,b)=>(a==='herald'?-1:b==='herald'?1:0))}
 S.queue=q;
}
function startWeek(){
 S.phase='court';S.usedW={};S.qi=0;S.wk=[];buildQueue();
 save();showStage('scene');hud();
 const ch=chapter(S.week);if(ch!==S.lastCh){S.lastCh=ch;$('#card').innerHTML=`<div>${CH[ch][0]}<small>${CH[ch][1]}</small></div>`;setTimeout(()=>{$('#card').innerHTML=''},3300)}
 $('#panel').innerHTML=`<h3>صباح الأسبوع ${A(S.week)}</h3><p class="muted">يفتح الحاجب أبواب القاعة. ${A(S.queue.length)} ${S.queue.length>2?'رعايا ينتظرون':'في الانتظار'}.</p>`;
 setTimeout(nextPetition,900);
}
function updQueue(){const q=$('#queue');const left=S.queue.length-S.qi-1;q.hidden=S.phase!=='court'||left<0;q.textContent=left>0?`في الانتظار: ${A(left)}`:'آخر الزوّار'}
function nextPetition(){
 if(S.qi>=S.queue.length){endCourt();return}
 const id=S.queue[S.qi],ev=E[id];updQueue();
 $('#panel').innerHTML=`<p class="muted">يدخل زائر…</p>`;
 walkIn(ev.who,()=>showPetition(id));
}
let typing=null;
function showPetition(id){
 const ev=E[id];const[name,role]=N[ev.who]||['زائر',''];const txt=typeof ev.text==='function'?ev.text():ev.text;
 $('#panel').innerHTML=`<div class="who"><canvas id="pt"></canvas><div><h2>${name}</h2><p>${role}</p></div></div>
  <div class="speech" id="sp" title="انقر لإكمال النص"></div><div class="opts" id="opts" hidden></div>`;
 portrait($('#pt'),ev.who);
 const sp=$('#sp');let i=0;clearInterval(typing);
 const finish=()=>{clearInterval(typing);sp.textContent=txt;renderOpts(id)};
 typing=setInterval(()=>{i+=2;sp.textContent=txt.slice(0,i);if(i%8===0)beep(300+Math.random()*80,.02,'square',.015);if(i>=txt.length)finish()},18);
 sp.onclick=finish;
}
function optState(o){
 for(const[k,v]of Object.entries(o.cost||{}))if(S[k]<v)return'لا يكفي '+STATN[k];
 if(o.req&&!avail(o.req))return N[o.req][0]+': '+retState(o.req);
 if(o.need&&!o.need())return o.hint||'غير متاح';
 return'';
}
function renderOpts(id){
 const ev=E[id],box=$('#opts');if(!box||!box.hidden)return;box.hidden=false;
 box.innerHTML=ev.opts.map((o,i)=>{const why=optState(o);
  const req=o.req?`<span class="chip req">يرسل: ${N[o.req][0]}</span>`:'';
  const risk=o.ch?`<span class="chip risk">نجاح ${A(o.ch.p*100)}٪</span>`:'';
  const nd=o.need&&o.hint?`<span class="chip ${why?'bad':'req'}">${o.hint}</span>`:'';
  return`<button class="opt" data-i="${i}" ${why?'disabled':''}><span>${o.t}</span><span class="chips">${costChips(o.cost)}${req}${risk}${why&&!o.hint?`<span class="chip bad">${why}</span>`:nd}</span></button>`}).join('');
 box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(id,+b.dataset.i));
}
function choose(id,i){
 const ev=E[id],o=ev.opts[i];if(optState(o))return;
 beep(660,.05);
 const costOut=[];for(const[k,v]of Object.entries(o.cost||{})){S[k]-=v;costOut.push([k,-v])}
 if(o.req)S.usedW[o.req]=1;
 S.done[id]=1;
 let eff=o.e,res=o.r,ok=null;
 if(o.ch){ok=Math.random()<o.ch.p;const b=ok?o.ch.ok:o.ch.no;eff=b.e;res=b.r}
 const out=costOut.concat(apply(eff));if(costOut.length)floatDeltas(costOut);
 if(out.some(([k,v])=>k==='gold'&&v>0))coin();
 const [name]=N[ev.who];
 S.log.push(`الأسبوع ${A(S.week)} · ${name}: ${o.t}`);
 if(res==='end'){finale();return}
 S.wk.push(`${name}: ${res}`);
 $('#panel').innerHTML=`<div class="who"><canvas id="pt"></canvas><div><h2>${name}</h2><p>قرارك: ${o.t}</p></div></div>
 <div class="speech result">${ok===true?'<b>نجاح. </b>':ok===false?'<b>فشل. </b>':''}${res}</div>
 <div class="chips">${chipsFor(out)}</div>
 <div class="row"><span class="muted">${S.qi+1<S.queue.length?'الزائر التالي ينتظر':'لا مزيد من الزوّار اليوم'}</span><button class="px gold" id="nx">التالي</button></div>`;
 portrait($('#pt'),ev.who);hud();
 $('#nx').onclick=()=>{$('#nx').disabled=true;S.qi++;walkOut(nextPetition)};$('#nx').focus();
 if(S.hap<=0){setTimeout(()=>ending('revolt'),600)}
}
function endCourt(){
 updQueue();$('#queue').hidden=true;
 $('#panel').innerHTML=`<h3>انتهى الاستقبال</h3><p>أُغلقت أبواب القاعة. حان وقت المجلس: أرسل مستشاريك في المهام، وراجع الخزانة وقوانين الأسبوع، ثم اختم الأسبوع.</p><button class="px gold" id="toC">إلى غرفة المجلس</button>`;
 $('#toC').onclick=()=>{S.phase='council';renderCouncil()};$('#toC').focus();
}

/* ---------- council ---------- */
function showStage(which){$('#scene').hidden=which!=='scene';$('#mapWrap').hidden=which!=='map';if(which==='map'&&!mapDrawn)drawMap()}
function retCard(k){const st=retState(k);const cls=st==='متاح'?'st-ok':st==='غائب'?'st-no':st==='في مهمة'?'st-mid':'st-no';
 const sk=Object.entries(RET[k].sk).filter(([,v])=>v>=2).map(([s,v])=>SKN[s]+' '+'■'.repeat(v)).join(' · ');
 return`<div class="ret${S.ret[k].on?'':' off'}"><canvas data-p="${k}"></canvas><div><b>${N[k][0]}</b><small class="${cls}">${st}${st==='مصاب'?' حتى الأسبوع '+A(S.ret[k].inj):''}</small><br><small class="muted">${sk}</small></div></div>`}
function renderCouncil(){
 showStage('map');renderNodes();hud();
 const L=LOC[selLoc];const ms=M.filter(m=>m.loc===selLoc&&(!m.cond||m.cond()));
 const ec=econ();
 const proj={gold:ec.goldIn-ec.upkeep,food:ec.foodIn-ec.foodUse};
 const keys=['ghazi','samar','raad','nawal'].filter(k=>S.ret[k].on||k!=='nawal'||!F('nonawal'));
 $('#panel').innerHTML=`
 <div class="sec"><h3>المجلس</h3><div class="rets">${keys.map(retCard).join('')}</div></div>
 <div class="sec"><h3>${L.n}</h3>${ms.length?ms.map(m=>misCard(m)).join(''):'<p class="muted">لا مهمّات هنا هذا الأسبوع. اختر موقعًا آخر من الخريطة.</p>'}</div>
 <div class="sec"><h3>الخزانة والقوانين</h3>
  <div><span class="muted">الضرائب</span><div class="seg">${TAX.map((t,i)=>`<button class="px small${S.tax===i?' on':''}" data-tax="${i}">${t.n}</button>`).join('')}</div></div>
  <div><span class="muted">حصص الطعام</span><div class="seg"><button class="px small${!S.ration?' on':''}" data-r="0">كاملة</button><button class="px small${S.ration?' on':''}" data-r="1">مقنّنة (−٢٥٪ استهلاك، −٤ رضا)</button></div></div>
  <div class="row"><span class="muted">التجنيد: ٢٥ ذهبًا ← ١٠ جنود (−٥ سكان، −١ رضا)</span><button class="px small" id="rec" ${S.gold<25||S.pop<20?'disabled':''}>جنّد</button></div>
  <div class="chips"><span class="chip ${proj.gold>=0?'good':'bad'}">${ic('gold')}الخزينة المتوقعة ${sg(proj.gold)} أسبوعيًا</span><span class="chip ${proj.food>=0?'good':'bad'}">${ic('food')}المؤن المتوقعة ${sg(proj.food)} أسبوعيًا</span>${ec.drought?'<span class="chip bad">الجفاف −٦ طعام (احفر الآبار)</span>':''}</div>
 </div>
 <button class="px gold" id="endW">اختم الأسبوع ${A(S.week)}</button>`;
 $('#panel').querySelectorAll('canvas[data-p]').forEach(c=>portrait(c,c.dataset.p,'#120d14'));
 $('#panel').querySelectorAll('[data-tax]').forEach(b=>b.onclick=()=>{S.tax=+b.dataset.tax;renderCouncil()});
 $('#panel').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.ration=+b.dataset.r;renderCouncil()});
 $('#rec').onclick=()=>{S.gold-=25;apply({soldiers:10,pop:-5,hap:-1});floatDeltas([['gold',-25]]);renderCouncil()};
 $('#panel').querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{const[mid,k]=b.dataset.send.split('|');const m=M.find(x=>x.id===mid);for(const[c,v]of Object.entries(m.cost||{}))S[c]-=v;S.missions.push({id:mid,ret:k,end:S.week+m.dur-1,at:S.week});beep(520,.06);renderCouncil()});
 $('#panel').querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>{const i=+b.dataset.cancel;const a=S.missions[i];const m=M.find(x=>x.id===a.id);for(const[c,v]of Object.entries(m.cost||{}))S[c]+=v;S.missions.splice(i,1);renderCouncil()});
 $('#endW').onclick=confirmEnd;
}
function misCard(m){
 const ai=S.missions.findIndex(a=>a.id===m.id);
 let body;
 if(ai>=0){const a=S.missions[ai];body=`<div class="row"><span class="chip req">${N[a.ret][0]} في المهمة حتى نهاية الأسبوع ${A(a.end)}</span>${a.at===S.week?`<button class="px small" data-cancel="${ai}">استدعِ</button>`:''}</div>`}
 else{const can=Object.entries(m.cost||{}).every(([k,v])=>S[k]>=v);
  const ks=['ghazi','samar','raad','nawal'].filter(k=>S.ret[k].on);
  body=`<div class="sendrow">${ks.map(k=>{const ok=avail(k)&&can;return`<button class="px small" data-send="${m.id}|${k}" ${ok?'':'disabled'} title="${retState(k)}">${N[k][0].split(' ').pop()} · ${A(chance(m,k)*100)}٪</button>`}).join('')}</div>`}
 return`<div class="mis"><header><b>${m.n}</b><span class="chips">${costChips(m.cost)}<span class="chip">${SKN[m.sk]}</span><span class="chip">${m.dur>1?'أسبوعان':'أسبوع'}</span>${m.risk?'<span class="chip risk">خطر إصابة</span>':''}</span></header><p>${m.d}</p>${body}</div>`}
function confirmEnd(){
 const idle=['ghazi','samar','raad','nawal'].filter(k=>avail(k));
 const ec=econ();const warn=[];
 if(idle.length)warn.push(`${idle.map(k=>N[k][0]).join('، ')} بلا مهمة.`);
 if(S.food+ec.foodIn-ec.foodUse<0)warn.push('المؤن لن تكفي: سيجوع الناس.');
 if(S.gold+ec.goldIn-ec.upkeep<0)warn.push('الخزينة ستعجز عن رواتب الجنود.');
 if(!warn.length){endWeek();return}
 $('#ov').hidden=false;$('#ov').innerHTML=`<div class="box"><h3>قبل أن تختم الأسبوع</h3>${warn.map(w=>`<p>${w}</p>`).join('')}<div class="row"><button class="px" id="cb">عودة</button><button class="px gold" id="cy">اختم على أي حال</button></div></div>`;
 $('#cb').onclick=()=>$('#ov').hidden=true;$('#cy').onclick=()=>{$('#ov').hidden=true;endWeek()};
}

/* ---------- week end ---------- */
function endWeek(){
 const R={treasury:[],stores:[],missions:[],events:[]};
 // missions
 const keep=[];
 for(const a of S.missions){if(a.end>S.week){keep.push(a);continue}
  const m=M.find(x=>x.id===a.id);const ok=Math.random()<chance(m,a.ret);
  const eff=ok?m.ok():m.no();let txt=(ok?'نجحت: ':'فشلت: ')+(ok?m.okT:m.noT);
  if(!ok&&m.risk&&Math.random()<.5){eff.injure=[a.ret,m.risk];txt+=`، وأُصيب ${N[a.ret][0]}`}
  const out=apply(eff);R.missions.push({who:N[a.ret][0],name:m.n,txt,out,ok});S.log.push(`الأسبوع ${A(S.week)} · مهمة «${m.n}» (${N[a.ret][0]}): ${ok?'نجاح':'فشل'}`)}
 S.missions=keep;
 // economy
 const ec=econ();
 R.treasury.push(['الضرائب ('+TAX[S.tax].n+')',Math.round((15+S.pop*.08+S.hap*.15)*TAX[S.tax].m)]);
 if(S.rel.river>=60)R.treasury.push(['تجارة بني النهر',10]);
 if(F('tolls'))R.treasury.push(['رسوم الجسور المخفّضة',-5]);
 R.treasury.push(['رواتب الجنود',-ec.upkeep]);
 S.gold+=ec.goldIn-ec.upkeep;
 R.stores.push(['حصاد الحقول',17]);if(ec.drought)R.stores.push(['الجفاف',-ec.drought]);
 R.stores.push(['إطعام السكان والجيش'+(S.ration?' (مقنّن)':''),-ec.foodUse]);
 S.food+=ec.foodIn-ec.foodUse;
 let dh=TAX[S.tax].h+(S.ration?-4:0);
 if(S.gold<0){const d=Math.ceil(S.soldiers*.15);S.soldiers-=d;S.gold=0;dh-=5;R.events.push(`لم تُدفع الرواتب: فرّ ${A(d)} جنديًا.`)}
 if(S.food<0){const d=Math.ceil(S.pop*.08);S.pop-=d;S.food=0;dh-=10;R.events.push(`مجاعة: مات أو رحل ${A(d)} من السكان.`)}
 if(S.hap>=65){S.pop+=3;R.events.push('الرخاء يجذب العائلات: +٣ سكان.')}
 if(S.hap>70)dh-=1;
 if(dh){S.hap=clamp(S.hap+dh,0,100);R.events.push(`تغيّر رضا الشعب بسبب القوانين والأحوال: ${sg(dh)}.`)}
 S.enemy+=6;R.events.push('جيش بهرام يكبر: يلتحق به الجائعون من الشرق.');
 if(S.clues>=3&&!F('exposed')&&!F('cluenote')){S.flags.cluenote=1;R.events.push('نوال وسليم يتفقان: كل الأدلة تشير إلى خاتم الأسد. الأمير رستم.')}
 const wk=S.week;S.week++;S.phase='report';hud();
 const sumLine=(arr)=>arr.map(([n,v])=>`<li><span>${n}</span><span class="${v>=0?'p':'n'}">${sg(v)}</span></li>`).join('');
 $('#panel').innerHTML=`<div class="ledger"><h3>دفتر الأسبوع ${A(wk)}</h3>
 <div><h4>${ic('gold')} الخزينة</h4><ul>${sumLine(R.treasury)}<li><span><b>الرصيد</b></span><span>${A(S.gold)}</span></li></ul></div>
 <div><h4>${ic('food')} المخازن</h4><ul>${sumLine(R.stores)}<li><span><b>الرصيد</b></span><span>${A(S.food)}</span></li></ul></div>
 ${R.missions.length?`<div><h4>تقارير المهام</h4><ul>${R.missions.map(m=>`<li class="note" style="display:block"><b>${m.name}</b> · ${m.who}: ${m.txt}.</li>`).join('')}</ul></div>`:''}
 ${S.wk.length?`<div><h4>ما جرى في القاعة</h4><ul>${S.wk.map(w=>`<li class="note" style="display:block">${w}</li>`).join('')}</ul></div>`:''}
 <div><h4>أحوال المملكة</h4><ul>${R.events.map(e=>`<li class="note" style="display:block">${e}</li>`).join('')}</ul></div>
 </div><button class="px gold" id="nw">${S.week===12?'بهرام عند الأسوار…':'الأسبوع '+A(S.week)}</button>`;
 showStage('scene');
 if(S.hap<=0){$('#nw').onclick=()=>ending('revolt');return}
 $('#nw').onclick=startWeek;$('#nw').focus();
}

/* ---------- finale ---------- */
function finale(){
 if(F('peacedone')){ending('peace');return}
 const me=myPower(),en=enemyPower();const r=me.total/en;
 S.battle={me,en,r};
 let k;if(r>=1.1)k=F('exposed')?(S.hap>=50?'dawn':'victory'):(S.hap>=60?'shadow':'stolen');else if(r>=.85)k='ashwin';else k=(F('betrothed')&&S.rel.horn>=50)?'exile':'fall';
 ending(k);
}
const ENDS={
 dawn:['الفجر فوق أرْوَند','انكسر جيش بهرام عند الأسوار، والخائن في القيد قبل أن تُفتح البوابة. حين خرجتَ إلى الساحة لم يهتف الناس لملكٍ منتصر فقط، بل لملكٍ سمعهم أسبوعًا بعد أسبوع. أرْوَند ستعيش جيلًا آخر.'],
 victory:['نصرٌ بلا تصفيق','ربحتَ الحرب. كشفتَ الخائن، وصمدت الأسوار. لكنّ الشعب الذي جاع وانتظر لا يحتفل كثيرًا. التاج ثابت على رأسك، والقلوب بعيدة.'],
 shadow:['نصرٌ وظل','صدّت أرْوَند الرماد. لكنّ الأمير رستم اختفى ليلة النصر مع رجال البرج، وخاتم الأسد ما زال في إصبعه. الشعب يحبّك، وهذا ما أنقذك من خنجره. حتى الآن.'],
 stolen:['العرش المسروق','انتصر جيشك، لكنّ رستم كان أسرع. في ليلة الاحتفال فتح رجاله أبواب القصر، والشعب الساخط لم يتحرّك. تشاهد من نافذة البرج أخاك يلبس تاجك.'],
 ashwin:['نصرٌ بطعم الرماد','صمدت أرْوَند بأعجوبة. تراجع بهرام، لكنّ نصف جيشك بقي في الحقول المحروقة. ستبني الأسوار من جديد، وستتعلّم أن النصر قد يكون أثقل من الهزيمة.'],
 exile:['المنفى في الجبال','سقطت البوابة. لكنّ أهل القرن نزلوا ليلًا وفتحوا لعائلتك طريقًا إلى الجبال. لينا وجسّار يقودان القافلة. أرْوَند ليست لك الآن، لكنّ دمك ما زال حيًّا.'],
 fall:['سقوط أرْوَند','دخل الرماد من البوابة الشرقية. كان الجيش أقلّ، والحلفاء أبعد، والوقت أقصر. يجلس بهرام على عرشك، ويُطعم شعبه من حقولك.'],
 peace:['سلام الرماد','فتحتَ المخازن بدل البوابات. رأى جنود بهرام الخبز يُوزَّع على جائعي الشرق، فأنزلوا سيوفهم. لن تُكتب عن هذا أغانٍ حربية، لكنّ أطفال الطرفين سيكبرون. هذه أندر النهايات وأصعبها.'],
 revolt:['ثورة الخبز','نفد صبر الشعب. اقتحم الحشد القاعة التي استقبلتَ فيها رعاياك. لا جيش بهرام ولا خيانة أخيك، بل شعبك هو من أنزلك عن العرش.'],
};
function ending(k){
 S.phase='end';try{localStorage.removeItem(SAVE)}catch(e){}
 const [t,body]=ENDS[k];const b=S.battle;
 const lines=[];
 if(b){lines.push(...b.me.parts.map(([n,v])=>`<li><span>${n}</span><span class="p">${A(v)}</span></li>`));lines.push(`<li><span><b>قوّتك</b></span><span>${A(b.me.total)}</span></li><li><span><b>جيش بهرام</b>${S.rel.moon>=70&&!F('betrayedmoon')?' (أضعفه سحر القمر)':''}${!F('exposed')?' (بمساعدة الخائن)':''}</span><span class="n">${A(b.en)}</span></li>`)}
 const fam=[];if(F('linatrust'))fam.push('لينا وثقت بك حتى النهاية.');if(F('linacold'))fam.push('لينا لم تسامحك على الخطبة.');if(F('queentrust'))fam.push('الملكة ديما بقيت إلى جانبك.');if(F('pardoned'))fam.push('رستم قاتل في الصف الأول ليمحو عاره.');if(F('betrayedmoon'))fam.push('أسيل لم تعد من الشرق.');
 $('#ov').hidden=false;$('#ov').innerHTML=`<div class="box ending"><p class="muted">النهاية</p><h1>${t}</h1><p>${body}</p>
 ${lines.length?`<div class="ledger"><h4>ميزان الحصار</h4><ul>${lines.join('')}</ul></div>`:''}
 ${fam.length?`<p class="muted">${fam.join(' ')}</p>`:''}
 <p class="muted">رضا ${A(S.hap)} · جنود ${A(S.soldiers)} · بنو النهر ${A(S.rel.river)} · أهل القرن ${A(S.rel.horn)} · رهبنة القمر ${A(S.rel.moon)}</p>
 <p class="muted">هناك تسع نهايات. قرارات مختلفة تفتح طرقًا مختلفة.</p>
 <button class="px gold" id="again">احكم من جديد</button><p class="credit">إنتاج استوديو قرطاس</p></div>`;
 $('#again').onclick=()=>{S=fresh();$('#ov').hidden=true;startWeek()};
}

/* ---------- modals ---------- */
function modal(html){$('#ov').hidden=false;$('#ov').innerHTML=`<div class="box">${html}<button class="px gold" id="mx">إغلاق</button></div>`;$('#mx').onclick=()=>$('#ov').hidden=true;$('#mx').focus()}
function showFactions(){
 const me=myPower();
 modal(`<h3>الفصائل والحرب</h3><p class="muted">الفصيل الذي تبلغ علاقته ٧٠ يقف معك يوم الحصار في الأسبوع ١٢.</p>
 ${['river','horn','moon'].map(k=>{const f=FAC[k],v=S.rel[k];return`<div class="fac"><div class="row"><b>${ic(k)} ${f.n} <span class="muted">(${f.lord})</span></b><b>${A(v)}</b></div><div class="bar"><i style="width:${v}%;background:${v>=70?'var(--moss)':'var(--gold)'}"></i><u></u></div><small>يعطون: ${f.give}</small><small class="muted">يريدون: ${f.want}</small></div>`}).join('')}
 <div class="ledger"><h4>ميزان الحرب الآن</h4><ul>${me.parts.map(([n,v])=>`<li><span>${n}</span><span class="p">${A(v)}</span></li>`).join('')}<li><span><b>قوّتك المتوقعة</b></span><span>${A(me.total)}</span></li><li><span><b>جيش بهرام</b></span><span class="n">${F('scouted')?A(enemyPower()):'مجهول، أرسل من يستطلعه'}</span></li></ul></div>`)}
function showLog(){modal(`<h3>سجل الحكم</h3><div class="log">${S.log.length?S.log.slice().reverse().map(l=>`<div>${l}</div>`).join(''):'<p class="muted">لم تُتخذ قرارات بعد.</p>'}</div>`)}
function showHelp(){modal(`<h3>طريقة اللعب</h3>
<p><b>كل أسبوع له ثلاث مراحل.</b> صباحًا تستقبل الرعايا والرسل في قاعة العرش وتقرّر في طلباتهم. بعضها يكلّف ذهبًا أو طعامًا أو جنودًا، وبعضها يحتاج إرسال أحد مستشاريك، فيصبح مشغولًا بقية الأسبوع.</p>
<p>بعد الاستقبال تنتقل إلى <b>المجلس</b>: خريطة المملكة ومهمّات في كل موقع. أرسل كل مستشار إلى مهمة تناسب مهارته، فنسبة النجاح تعتمد عليها. وغيّر الضرائب وحصص الطعام وجنّد الجنود.</p>
<p>عند ختم الأسبوع تُحسب الضرائب ورواتب الجيش والطعام المستهلك، وتصلك تقارير المهام. الجوع يقتل السكان، والإفلاس يُفرّ الجنود، ورضا الشعب إن وصل صفرًا سقط عرشك.</p>
<p><b>الهدف:</b> في الأسبوع ١٢ يصل بهرام. اجمع جيشًا، وارفع الأسوار، واكسب ثلاثة فصائل، واكشف الخائن في بلاطك قبل أن يفتح البوابة. أو ابحث عن طريق لا يحتاج حربًا.</p>`)}

/* ---------- save / boot ---------- */
const SAVE='arvand_save_v1';
function save(){try{localStorage.setItem(SAVE,JSON.stringify(S))}catch(e){}}
function load(){try{const s=localStorage.getItem(SAVE);return s?JSON.parse(s):null}catch(e){return null}}
function title(){
 const sv=load();
 $('#ov').hidden=false;$('#ov').innerHTML=`<div class="box"><div class="title-name">عرش أرْوَند</div><p class="title-sub">لعبة إدارة مملكة وقرارات</p>
 <p>أنت الملك سالار. الجفاف يأكل حقولك، وأخوك يبتسم أكثر مما ينبغي، وفي الشرق يجمع بهرام سيّد أرض الرماد جيشًا جائعًا. أمامك اثنا عشر أسبوعًا قبل أن يطرق بوابتك.</p>
 <p class="muted">استقبل رعاياك، وأدِر الذهب والطعام والجنود، وأرسل مستشاريك في المهام، واكسب الحلفاء أو اخسرهم. كل قرار يُحسب.</p>
 <div class="row"><button class="px gold" id="ng">ابدأ الحكم</button>${sv?`<button class="px" id="cg">تابع من الأسبوع ${A(sv.week)}</button>`:''}<button class="px" id="hp">طريقة اللعب</button></div>
 <p class="credit">إنتاج استوديو قرطاس</p></div>`;
 $('#ng').onclick=()=>{S=fresh();$('#ov').hidden=true;beep(392,.1);startWeek()};
 if(sv)$('#cg').onclick=()=>{S=sv;S.lastCh=0;$('#ov').hidden=true;startWeek()};
 $('#hp').onclick=showHelp;
}
function boot(data){
 S=fresh();hud();$('#panel').innerHTML=`<h3>قاعة العرش</h3><p class="muted">الشموع مضاءة، والعرش ينتظر.</p>`;
 requestAnimationFrame(loop);
 if(data&&data.S&&data.S.phase!=='end'){S=data.S;S.lastCh=0;startWeek()}else title();
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.__arvand={get S(){return S},E,M,choose,endWeek,finale,myPower,enemyPower,startWeek,renderCouncil};
(window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{}));
</script>
